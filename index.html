<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Gudang</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
  --sb-bg: #0f172a;
  --sb-hover: #1e293b;
  --accent: #2563eb;
  --main-bg: #f8fafc;
}

body { 
  background-color: var(--main-bg); 
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
  color: #334155; 
  overflow-x: hidden;
}

/* Layout Wrapper */
.wrapper {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* Sidebar Styling */
#sidebar {
  min-width: 260px;
  max-width: 260px;
  background: var(--sb-bg);
  color: #cbd5e1;
  transition: all 0.3s;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 1000;
}

.sidebar-brand { 
  padding: 20px; 
  border-bottom: 1px solid #1e293b; 
  text-align: center; 
}

.nav-link { 
  color: #94a3b8; 
  cursor: pointer; 
  padding: 12px 18px; 
  font-weight: 500; 
  border-radius: 8px; 
  margin: 4px 12px; 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  transition: all 0.2s ease; 
}

.nav-link:hover { color: #f8fafc; background: var(--sb-hover); }
.nav-link.active { color: #ffffff; background: var(--accent); }

/* Main Content Area */
#content {
  width: calc(100% - 260px);
  margin-left: 260px;
  min-height: 100vh;
  padding: 30px;
  transition: all 0.3s;
}

/* Login Card Styling */
#login-page { 
  height: 100vh; 
  width: 100vw;
  display: flex; 
  align-items: center; 
  justify-content: center; 
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  position: fixed;
  top: 0;
  left: 0;
  z-index: 2000;
}

.login-card { 
  border: none; 
  border-radius: 16px; 
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4); 
  background: rgba(255, 255, 255, 0.98); 
}

/* Common UI Component Enhancements */
.card-custom { 
  border: none; 
  border-radius: 12px; 
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); 
  background: white; 
}

.table th { 
  font-weight: 600; 
  text-transform: uppercase; 
  font-size: 0.725rem; 
  letter-spacing: 0.5px; 
  color: #64748b; 
  background-color: #f1f5f9; 
  border-bottom: 2px solid #e2e8f0;
}

.badge-status { padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }
</style>
</head>
<body>

  <!-- ==================== HALAMAN LOGIN ==================== -->
  <div id="login-page" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4 fw-bold">Login Sistem</h3>
      <div class="mb-3">
        <label for="user" class="form-label">Username</label>
        <input type="text" id="user" class="form-control" placeholder="Masukkan username">
      </div>
      <div class="mb-3">
        <label for="pass" class="form-label">Password</label>
        <input type="password" id="pass" class="form-control" placeholder="Masukkan password">
      </div>
      <button class="btn btn-primary w-100 fw-bold py-2 mb-2" onclick="login()">Login</button>
      <div id="login-msg" class="text-danger small text-center fw-semibold"></div>
    </div>
  </div>

  <!-- ==================== HALAMAN UTAMA ==================== -->
  <div id="main-page" class="d-none">
    <!-- Navbar Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">GUDANG APP</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link pointer" onclick="showPage('dashboard')">Dashboard</a>
            </li>
            <!-- Menu Barang Masuk (Hanya Muncul untuk Admin) -->
            <li id="menuBarangMasuk" class="nav-item d-none">
              <a class="nav-link pointer" onclick="showPage('masuk')">Barang Masuk</a>
            </li>
            <li class="nav-item">
              <a class="nav-link pointer" onclick="showPage('keluar')">Barang Keluar</a>
            </li>
          </ul>
          <div class="d-flex align-items-center text-white me-3">
            <i class="bi bi-person-circle me-2"></i>
            <span id="display-role" class="badge bg-secondary">Role</span>
          </div>
          <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
      </div>
    </nav>

    <!-- Konten Halaman -->
    <div class="container my-4">
      
      <!-- Page 1: Dashboard -->
      <div id="page-dashboard" class="page-content">
        <h2>Selamat Datang</h2>
        <p class="text-muted">Pilih menu navigasi di atas untuk memulai transaksi inventaris.</p>
      </div>

      <!-- Page 2: Form Transaksi (Masuk / Keluar) -->
      <div id="page-form" class="page-content d-none">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
          <h4 id="form-title" class="fw-bold mb-3">Form Transaksi</h4>
          
          <div class="mb-3">
            <label for="tanggal" class="form-label">Tanggal</label>
            <input type="date" id="tanggal" class="form-control">
          </div>
          <div class="mb-3">
            <label for="kode_barang" class="form-label">Kode SKU Barang</label>
            <input type="text" id="kode_barang" class="form-control" placeholder="Contoh: SKU-001">
          </div>
          <div class="mb-3">
            <label for="jumlah" class="form-label">Jumlah</label>
            <input type="number" id="jumlah" class="form-control" min="1" placeholder="0">
          </div>
          <div class="mb-3">
            <label for="keterangan" class="form-label">Keterangan / Alasan</label>
            <textarea id="keterangan" class="form-control" rows="2" placeholder="Catatan tambahan..."></textarea>
          </div>

          <button id="btn-submit" type="button" class="btn btn-primary w-100 fw-bold py-2 shadow-sm pointer" onclick="prosesTransaksi()">
            <i class="bi bi-check2-circle me-1"></i> Validasi Dokumen
          </button>
          <div id="trans-msg" class="text-center mt-2 small"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // ⚠️ MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwkjlYxlJQj4xFBbyx3MZPNWhSLdTSU8AefOrZDOm75DdsetqywWVcRh76U3FLlSlBgYw/exec"; 

    // Variabel Global
    var session = null;
    var isMasuk = false;

    // Set tanggal hari ini otomatis di input form
    document.getElementById('tanggal').valueAsDate = new Date();

    // ==========================================
    // 1. FUNGSI LOGIN VIA FETCH (API HTTP)
    // ==========================================
    function login() {
      const user = document.getElementById('user').value;
      const pass = document.getElementById('pass').value;
      const msg = document.getElementById('login-msg');

      if(!user || !pass) {
        msg.innerText = "Username dan password wajib diisi!";
        return;
      }

      msg.innerText = "Memverifikasi enkripsi keamanan...";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "checkLogin",
          username: user,
          password: pass
        })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          session = res; // Simpan data login ke session global
          
          document.getElementById('login-page').classList.add('d-none');
          document.getElementById('main-page').classList.remove('d-none');
          document.getElementById('display-role').innerText = session.role;

          // PROTEKSI BARANG MASUK: HANYA MUNCUL JIKA ROLE BUKAN STAF
          var menuMasuk = document.getElementById("menuBarangMasuk");
          if (menuMasuk) {
            if (session.role === "Staf") {
              menuMasuk.classList.add('d-none');
            } else {
              menuMasuk.classList.remove('d-none');
            }
          }

          showPage('dashboard');
        } else {
          msg.innerText = "Kombinasi Username & Password salah!";
        }
      })
      .catch(err => {
        msg.innerText = "Gagal terhubung ke server! Periksa koneksi atau URL GAS.";
        console.error(err);
      });
    }

    // ==========================================
    // 2. FUNGSI NAVIGASI HALAMAN
    // ==========================================
    function showPage(page) {
      document.getElementById('page-dashboard').classList.add('d-none');
      document.getElementById('page-form').classList.add('d-none');

      if(page === 'dashboard') {
        document.getElementById('page-dashboard').classList.remove('d-none');
      } 
      else if(page === 'masuk') {
        isMasuk = true;
        document.getElementById('page-form').classList.remove('d-none');
        document.getElementById('form-title').innerText = "Form Barang Masuk";
        
        let btn = document.getElementById('btn-submit');
        btn.className = "btn btn-success w-100 fw-bold py-2 shadow-sm pointer";
      } 
      else if(page === 'keluar') {
        isMasuk = false;
        document.getElementById('page-form').classList.remove('d-none');
        document.getElementById('form-title').innerText = "Form Barang Keluar";
        
        let btn = document.getElementById('btn-submit');
        btn.className = "btn btn-danger w-100 fw-bold py-2 shadow-sm pointer";
      }
    }

    // ==========================================
    // 3. FUNGSI PROSES TRANSAKSI
    // ==========================================
    function prosesTransaksi() {
      const tipeTransaksi = isMasuk ? "MASUK" : "KELUAR";
      const tanggal = document.getElementById('tanggal').value;
      const kode = document.getElementById('kode_barang').value;
      const jumlah = document.getElementById('jumlah').value;
      const ket = document.getElementById('keterangan').value;
      const msg = document.getElementById('trans-msg');

      if (!tanggal || !kode || !jumlah) {
        alert("Mohon lengkapi Tanggal, Kode SKU, dan Jumlah Barang!");
        return;
      }

      msg.innerText = "Sedang memproses ke sistem...";

      const dataTransaksi = {
        tanggal: tanggal,
        kode: kode,
        jumlah: Number(jumlah),
        ket: ket,
        vendor: ""
      };

      // Ambil nama user otomatis dari data session login
      const userYangLogin = session ? (session.username || session.user) : "Unknown";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitTransaction",
          type: tipeTransaksi,
          data: dataTransaksi,
          user: userYangLogin
        })
      })
      .then(res => res.text())
      .then(responseText => {
        alert(responseText);
        msg.innerText = "";
        
        // Reset Form
        document.getElementById('kode_barang').value = "";
        document.getElementById('jumlah').value = "";
        document.getElementById('keterangan').value = "";
      })
      .catch(err => {
        alert("Terjadi kesalahan pengiriman!");
        msg.innerText = "";
        console.error(err);
      });
    }

    // ==========================================
    // 4. FUNGSI LOGOUT
    // ==========================================
    function logout() {
      session = null;
      document.getElementById('user').value = "";
      document.getElementById('pass').value = "";
      document.getElementById('login-msg').innerText = "";
      document.getElementById('main-page').classList.add('d-none');
      document.getElementById('login-page').classList.remove('d-none');
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
